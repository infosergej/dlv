    <!DOCTYPE html>
    <html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Maršruto Planavimo Sistema ADPAKAS</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>
    <button id="toggle-sidebar-btn" onclick="toggleSidebar()">🗺️ Paslėpti meniu</button>
    <button id="gps-btn" onclick="findMyLocation()" title="Nustatyti mano vietą">🎯</button>
    

    <div id="sidebar">
        <h3>Sąrašas <span class="badge" id="count">0 gavėjų</span></h3>
        <div class="section-label">📍 Maršruto pradžia (A taškas)</div>
        <div class="search-container start-input-box">
            <input type="text" id="start-input" class="search-input" placeholder="Įveskite starto vietą..." autocomplete="off" oninput="debounceSearch(this.value, 'start')">
            <div id="start-suggestions" class="suggestions-box"></div>
        </div>

        <div id="start-point-display" style="display: none; align-items: center; justify-content: space-between; width: 100%; background: rgba(46, 204, 113, 0.06); border: 1px dashed var(--success); padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
        <span class="icon">✓</span> 
        <span id="start-point-text" style="word-break: break-word; font-weight: 600; font-size: 13.5px; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
    </div>
    <button onclick="deleteStartPoint()" style="background: none; border: none; color: #a4b0be; font-size: 22px; cursor: pointer; padding: 0 5px; line-height: 1; transition: color 0.2s;" onmouseover="this.style.color='#e74c3c'" onmouseout="this.style.color='#a4b0be'">×</button>
    </div>
        <div class="section-label">📦 Pristatymo adresai</div>
        <div class="search-container delivery-input-box">
            <input type="text" id="address-input" class="search-input" placeholder="Įveskite gavėjo adresą..." autocomplete="off" oninput="debounceSearch(this.value, 'delivery')">
            <div id="suggestions" class="suggestions-box"></div>
        </div>
        
        <ul id="address-list"></ul>
        
        <div class="btn-container">
            <button id="route-btn" onclick="buildFinalRoute()" disabled>Sukurti maršrutą</button>
        </div>
    </div>
    <div id="map"></div>
</body>
</html>
